name: Build and Deploy to Hostinger Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL }}
        run: npm run build

      - name: Publish dist/ to deploy branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy build from ${{ github.sha }}"
          git branch -M deploy
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Trigger Hostinger Auto-Deploy Webhook
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
        run: |
          if [ -n "$HOSTINGER_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$HOSTINGER_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"ref":"refs/heads/deploy"}'
          else
            echo "HOSTINGER_WEBHOOK_URL secret not set yet; skipping webhook trigger."
          fi
